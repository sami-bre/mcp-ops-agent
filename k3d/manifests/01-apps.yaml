# Demo apps for the ops-demo k3d cluster.
# payments-api deliberately crash-loops: real CrashLoopBackOff + real logs
# for the agent's read-only kubectl tools to investigate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: payments-api }
  template:
    metadata:
      labels: { app: payments-api }
    spec:
      containers:
        - name: payments-api
          image: python:3.12-alpine
          command:
            - python
            - -c
            - "print('[boot] payments-api starting', flush=True); print('[boot] connecting to redis...', flush=True); print('Traceback: PaymentError: redis connection refused', flush=True); import sys; sys.exit(1)"
          env:
            - name: REDIS_URL
              value: redis://redis.demo.svc.cluster.local:6379/0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:alpine
          ports:
            - containerPort: 6379